<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>scene</title>
<link rel="stylesheet" href="__MAPLIBRE_CSS__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070d1c; }
  #map { position: absolute; inset: 0; }
  #map canvas { filter: brightness(1.3) saturate(1.1); }
  #titlebg { position: absolute; left: 360px; right: 360px; top: 230px; height: 400px; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(7,13,28,.88) 0%, rgba(7,13,28,.7) 45%, rgba(7,13,28,0) 72%); }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display: none !important; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(7,13,28,0) 35%, rgba(7,13,28,.55) 75%, rgba(7,13,28,.85) 100%); }
  #dim { position: absolute; inset: 0; background: #070d1c; opacity: 0; pointer-events: none; }
  .txt { position: absolute; left: 0; right: 0; text-align: center; color: #F6F1E3; font-family: 'Noto Sans TC', sans-serif;
    opacity: 0; transition: none; text-shadow: 0 2px 18px rgba(0,0,0,.65); }
  #eyebrow { top: 250px; font-size: 46px; font-weight: 700; letter-spacing: .04em; }
  #big { top: 300px; font-family: 'Fredoka', 'Noto Sans TC', sans-serif; font-size: 250px; font-weight: 700; color: #FFC94A;
    line-height: 1; text-shadow: 0 0 40px rgba(255,201,74,.45), 0 4px 24px rgba(0,0,0,.6); }
  #caption { top: 575px; font-size: 56px; font-weight: 900; letter-spacing: .03em; }
  #title { top: 300px; font-size: 128px; font-weight: 900; letter-spacing: .06em; }
  #title b { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #FFC94A; margin-right: 18px; letter-spacing: 0; }
  #tagline { top: 470px; font-size: 64px; font-weight: 700; color: #FFE6A3; letter-spacing: .12em; }
  #note { top: 34px; bottom: auto; left: 48px; right: auto; text-align: left; font-size: 22px; font-weight: 500; color: rgba(246,241,227,.72); }
  #credit { top: 34px; bottom: auto; right: 48px; left: auto; text-align: right; font-size: 20px; font-weight: 500; color: rgba(246,241,227,.6); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  body.ending #tagline { top: 360px; font-size: 104px; font-weight: 900; color: #FFF4D6; letter-spacing: .1em;
    text-shadow: 0 0 36px rgba(255,201,74,.55), 0 4px 22px rgba(0,0,0,.7); }
  body.ending #title { top: 540px; font-size: 60px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="vignette"></div>
<div id="dim"></div>
<div id="eyebrow" class="txt"></div>
<div id="big" class="txt"></div>
<div id="caption" class="txt"></div>
<div id="titlebg"></div>
<div id="title" class="txt"><b>yoxi</b>點燈城</div>
<div id="tagline" class="txt">平常點燈，出門不用賭</div>
<div id="note" class="txt"></div>
<div id="credit" class="txt">地圖 © OpenFreeMap © OpenStreetMap</div>
<div id="fade"></div>
<script src="__MAPLIBRE_JS__"></script>
<script src="__H3_JS__"></script>
<script>
const DATA = __DATA__;
const MODE = DATA.mode, T = DATA.T;
document.body.className = MODE;
const RES = 10;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);

// 隨機數固定種子，每次錄都一樣
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function cellsAlong(path) {
  const out = [], seen = new Set();
  for (let i = 0; i < path.length - 1; i++) {
    const [x1, y1] = path[i], [x2, y2] = path[i + 1];
    const d = Math.hypot((x2 - x1) * 101000, (y2 - y1) * 111000), n = Math.max(1, Math.ceil(d / 50));
    for (let k = 0; k <= n; k++) {
      const t = k / n, c = h3.latLngToCell(y1 + (y2 - y1) * t, x1 + (x2 - x1) * t, RES);
      if (!seen.has(c)) { seen.add(c); out.push(c); }
    }
  }
  return out;
}

const routes = Object.fromEntries(DATA.routes.map((r) => [r.id, r]));
const cells = new Map(); // h3 -> {id, past, on, lv}
const getCell = (h) => { if (!cells.has(h)) cells.set(h, { id: cells.size + 1, h, past: null, on: null, lv: 0 }); return cells.get(h); };

// 主角路線（開場最後一路亮起）與其他人的路線
const HERO = ['morning-work', 'evening-home', 'afternoon-songyan', 'commute-dunhua'];
const OTHERS = DATA.routes.map((r) => r.id).filter((id) => !HERO.includes(id));
HERO.forEach((id, i) => cellsAlong(routes[id].path).forEach((h, k) => { const c = getCell(h); const t = DATA.heroStart + i * 0.35 + k * 0.022; c.on = c.on == null ? t : Math.min(c.on, t); c.lv = Math.max(c.lv, 3); }));
OTHERS.forEach((id, i) => cellsAlong(routes[id].path).forEach((h, k) => { const c = getCell(h); const t = DATA.othersStart + rnd() * 1.2 + k * 0.012; c.on = c.on == null ? t : Math.min(c.on, t); c.lv = Math.max(c.lv, 1); }));
// 開場的「平常日」：零星、暗暗的格子
for (const c of cells.values()) if (rnd() < DATA.pastShare) c.past = rnd() * 3.5;

const feats = [], pts = [];
for (const c of cells.values()) {
  const b = h3.cellToBoundary(c.h, true);
  feats.push({ type: 'Feature', id: c.id, properties: {}, geometry: { type: 'Polygon', coordinates: [b] } });
  const [lat, lng] = h3.cellToLatLng(c.h);
  pts.push({ type: 'Feature', id: c.id, properties: {}, geometry: { type: 'Point', coordinates: [lng, lat] } });
}

const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/dark', center: DATA.cam0.center, zoom: DATA.cam0.zoom,
  bearing: DATA.cam0.bearing || 0, interactive: false, attributionControl: false, fadeDuration: 0 });
window.ready = false;
map.on('load', () => {
  map.addSource('cells', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
  map.addSource('glow', { type: 'geojson', data: { type: 'FeatureCollection', features: pts } });
  map.addLayer({ id: 'glow', type: 'circle', source: 'glow', paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 6, 13, 18], 'circle-blur': 1, 'circle-color': '#FFC94A',
    'circle-opacity': ['*', ['coalesce', ['feature-state', 'a'], 0], ['coalesce', ['feature-state', 'g'], 0.5]] } });
  map.addLayer({ id: 'cells', type: 'fill', source: 'cells', paint: {
    'fill-color': ['match', ['coalesce', ['feature-state', 'lv'], 1], 1, '#B8812F', 2, '#E9B23F', '#FFE9A8'],
    'fill-opacity': ['*', ['coalesce', ['feature-state', 'a'], 0], 0.88] } });
  map.addLayer({ id: 'edges', type: 'line', source: 'cells', paint: {
    'line-color': '#FFE7A8', 'line-width': 0.8, 'line-opacity': ['*', ['coalesce', ['feature-state', 'a'], 0], 0.5] } });
  map.once('idle', () => document.fonts.ready.then(() => { window.ready = true; }));
});

function setText(id, html) { if ($(id).innerHTML !== html) $(id).innerHTML = html; }
const show = (id, a) => { $(id).style.opacity = clamp(a).toFixed(3); };

let t0 = null;
window.start = () => { t0 = performance.now(); requestAnimationFrame(frame); };

function cellAlpha(c, t) {
  let a = 0, lv = 1, g = 0.35;
  if (c.past != null && MODE === 'opening') {
    const on = ease((t - c.past) / 0.8), off = 1 - ease((t - T.l3) / 1.8);
    const twinkle = 0.75 + 0.25 * Math.sin(t * 2.2 + c.id);
    a = Math.max(a, 0.42 * on * off * twinkle);
  }
  if (c.on != null && t >= c.on) {
    const x = ease((t - c.on) / 0.45) * (c.lv >= 3 ? 1 : 0.7);
    if (x > a) { a = x; lv = x > 0.6 ? c.lv : Math.min(c.lv, 2); g = 0.55 + 0.45 * Math.max(0, 1 - (t - c.on) / 1.2); }
  }
  return { a, lv, g };
}

function frame() {
  const t = (performance.now() - t0) / 1000;
  // 鏡頭
  const k = ease((t - DATA.cam1.at) / DATA.cam1.dur);
  map.jumpTo({ center: [lerp(DATA.cam0.center[0], DATA.cam1.center[0], k), lerp(DATA.cam0.center[1], DATA.cam1.center[1], k)],
    zoom: lerp(DATA.cam0.zoom, DATA.cam1.zoom, k) + DATA.drift * t, bearing: lerp(DATA.cam0.bearing || 0, DATA.cam1.bearing || 0, k) });
  for (const c of cells.values()) {
    const s = cellAlpha(c, t);
    if (c._a !== s.a || c._lv !== s.lv || c._g !== s.g) {
      map.setFeatureState({ source: 'cells', id: c.id }, { a: s.a, lv: s.lv });
      map.setFeatureState({ source: 'glow', id: c.id }, { a: s.a, g: s.g });
      c._a = s.a; c._lv = s.lv; c._g = s.g;
    }
  }
  if (MODE === 'opening') {
    // 89% → 33% → 變暗 → 片名
    const n1 = ease((t - T.l1 - 0.2) / 0.5) * (1 - ease((t - T.l2 + 0.25) / 0.35));
    const n2 = ease((t - T.l2) / 0.45) * (1 - ease((t - T.l3) / 0.5));
    if (t < T.l2) {
      setText('eyebrow', '當月有搭 yoxi 的人'); setText('caption', '的日子，沒有搭車');
      setText('big', Math.round(89 * ease((t - T.l1 - 0.3) / 1.1)) + '%');
      show('eyebrow', n1); show('big', n1); show('caption', ease((t - T.l1 - 1.3) / 0.5) * n1);
    } else {
      setText('eyebrow', '有搭過 yoxi 的人'); setText('caption', '三個月只搭過 1 次'); setText('big', '33%');
      show('eyebrow', n2); show('big', n2); show('caption', ease((t - T.l2 - 0.5) / 0.5) * n2);
    }
    setText('note', '資料：yoxi 競賽資料 2026/2/1–4/30（約 96.5 萬筆行程，彙總分析）');
    show('note', ease((t - T.l1) / 0.6) * (1 - ease((t - T.l3) / 0.6)));
    $('dim').style.opacity = (0.45 * ease((t - T.l3) / 2.0) * (1 - ease((t - T.l4) / 1.0))).toFixed(3);
    show('title', ease((t - T.l4 - 0.4) / 0.8));
    show('titlebg', ease((t - T.l4 - 0.2) / 0.8));
    show('tagline', ease((t - T.l4b) / 0.8));
    show('credit', 1);
  } else {
    show('tagline', ease((t - T.l20) / 0.9));
    show('titlebg', ease((t - T.l20 + 0.3) / 0.9));
    show('title', ease((t - T.l20 - 1.0) / 0.9));
    show('credit', ease((t - T.l20 - 1.6) / 0.8));
    $('fade').style.opacity = ease((t - T.fade) / 1.4).toFixed(3);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
