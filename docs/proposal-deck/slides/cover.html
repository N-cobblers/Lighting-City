<p style="position:absolute;left:128px;bottom:64px;width:720px;font-size:24px;color:#9AA8C2">團隊：[團隊名稱]　｜　yoxi 挑戰：不搭車，也打開 yoxi</p>
<aside>大家好，我們是［團隊名稱］。叫車 App 平常只在要出門時才會被打開。我們的提案「yoxi 點燈城」想做到的是：就算今天不搭車，你也有理由打開 yoxi。城市一開始是夜色，你的每一趟 yoxi、每一個完成的 AI 任務，都會把城市點亮。</aside>
